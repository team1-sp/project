name: Bug
description: Something in the engine, game or services behaves wrongly
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or build
      placeholder: e.g. 95cb8d9
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options: [Normal (window), Headless, Both, Not applicable]
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Blocks work, Wrong result, Cosmetic]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Telemetry, logs or screenshots
      description: Attach files or paste the relevant lines.
