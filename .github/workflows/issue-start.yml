# When an issue moves to "In progress" on the GitHub project, create its work branch
# (<type>/<issue>-<short-description>). It never opens a pull request: the developer opens
# it after the first push. tools/start_task.py, docs/guidelines/git-workflow.md
#
# Project status changes do not trigger workflows, so this polls the project every 10 minutes.
# Needs the PROJECT_TOKEN secret: a token that can read the org project and write this repo
# (classic: `repo` + `read:project`; fine-grained: Contents read/write, Issues read/write and
# organization Projects read). Without it, only the manual run with an issue number works.
name: Issue start

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to start now (leave empty to check the project)
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: issue-start

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create branches for issues in progress
        run: python3 tools/start_task.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: team1-sp
          PROJECT_NUMBER: "3"
          STATUS_NAME: In progress
          ISSUE_NUMBER: ${{ inputs.issue }}
