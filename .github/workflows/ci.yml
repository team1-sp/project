# One workflow for every pull request. Jobs run only for the areas a change touches;
# `ci-ok` is the single check main requires. Plan: docs/guidelines/git-workflow.md
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      cpp: ${{ steps.filter.outputs.cpp }}
      build: ${{ steps.filter.outputs.build }}
      bridge: ${{ steps.filter.outputs.bridge }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - '**/*.md'
            cpp:
              - '**/*.{c,cc,cpp,cxx,h,hh,hpp,hxx,inl}'
              - '.clang-format'
            build:
              - '**/*.{c,cc,cpp,cxx,h,hh,hpp,hxx,inl,in}'
              - '**/CMakeLists.txt'
              - 'cmake/**'
              - 'CMakePresets.json'
              - '.github/workflows/ci.yml'
            bridge:
              - 'benchmarks/bridge/**'
              - 'engine/bridge/**'
              - 'tests/unit/bridge/**'
              - 'CMakeLists.txt'
              - 'engine/CMakeLists.txt'
              - 'tests/CMakeLists.txt'
              - 'cmake/**'
              - '.github/workflows/ci.yml'
            python:
              - 'ai-services/**'
              - 'semantic/**'
              - '.github/workflows/ci.yml'

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Branch name and linked issue
        run: python3 tools/check_pr.py
      - name: Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            perf
            docs
            build
            ci
            chore
            research
            revert
          requireScope: false

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Relative links point to existing files
        run: python3 tools/check_md_links.py .

  format:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format 19 (DEC-031)
        run: python3 -m pip install --user clang-format==19.1.7
      - name: C++ files match .clang-format
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inl' \
            ':!:third_party/**' ':!:external/**' \
            | xargs -0 -r "$HOME/.local/bin/clang-format" --dry-run -Werror
      - name: Box2D and raylib stay in their adapter targets (R-3, R-4)
        run: python3 tools/check_includes.py .

  build:
    # Configure, build and test with the same presets developers use (PB-002). Windows and
    # macOS are the development platforms (DEC-029); `headless` proves the build works
    # without raylib (R-6).
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-debug
          - os: macos-latest
            preset: macos-debug
          - os: ubuntu-latest
            preset: headless
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep the FetchContent downloads (Box2D, raylib, GoogleTest) between runs, so configure
      # skips the git clones. Their *-build folders are left out: the libraries are always
      # compiled fresh with this runner's compiler. A version change in Dependencies.cmake
      # gives a new key, so stale sources are never reused (PB-004.2).
      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps
            !build/${{ matrix.preset }}/_deps/*-build
          key: deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DENGINE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  python:
    # Ruff and pytest for the Python packages (PB-004.4). Each package folder with a
    # pyproject.toml is checked with its own pinned development tools and settings.
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: ruff and pytest
        run: |
          found=0
          for pkg in ai-services semantic; do
            [ -f "$pkg/pyproject.toml" ] || continue
            found=1
            echo "::group::$pkg"
            python -m pip install --quiet -e "./$pkg[dev]"
            python -m ruff check "$pkg"
            (cd "$pkg" && python -m pytest)
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then
            echo "No Python package with a pyproject.toml yet; nothing to check."
          fi

  bridge-benchmark:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    # Pinned so the apt gRPC/protobuf/FlatBuffers versions only change when we bump this line.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install optional benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppzmq-dev flatbuffers-compiler libflatbuffers-dev libgrpc++-dev libprotobuf-dev libzmq3-dev protobuf-compiler protobuf-compiler-grpc
          python -m pip install -e "benchmarks/bridge/python[dev]"
      - name: Configure and build bridge benchmarks
        run: |
          cmake -S . -B build/bridge-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_WITH_RAYLIB=OFF \
            -DENGINE_BUILD_TESTS=ON \
            -DENGINE_WARNINGS_AS_ERRORS=ON \
            -DAEGIS_BUILD_BRIDGE_BENCHMARKS=ON \
            -DAEGIS_BRIDGE_PYTHON_EXECUTABLE="$(command -v python)"
          cmake --build build/bridge-ci --parallel
      - name: Test bridge request/reply and concurrency
        run: ctest --test-dir build/bridge-ci --output-on-failure

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the change for secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown

  ci-ok:
    # Skipped when a newer push cancels this run, so superseded runs don't report a failure.
    if: ${{ always() && !cancelled() }}
    needs: [changes, pr-hygiene, docs, format, build, python, bridge-benchmark, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass."
              exit 1
            fi
          done
