# Close an epic (type:epic) once all of its sub-issues are closed.
# On every closed issue it checks that issue's parent; run it by hand to check every open epic.
# The project's built-in "Item closed" workflow then moves the epic's card to Done, so no
# PROJECT_TOKEN is needed. tools/close_epics.py, docs/guidelines/git-workflow.md
name: Epic close

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the epics that would be closed
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: epic-close-${{ github.event.issue.number || 'sweep' }}

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Close epics whose sub-issues are all closed
        run: python3 tools/close_epics.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          DRY_RUN: ${{ inputs.dry_run }}
