# Fills a new pull request from the issue its branch was started for: `Closes #<issue>`,
# labels, milestone, assignees, and a Conventional Commit title if it has none. tools/fill_pr.py
name: PR fill

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  fill:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fill the PR from its issue
        run: python3 tools/fill_pr.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
